name: IndexNow 알림
on:
  push:
    branches: [main]
    paths: ["sitemap.xml"]
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Cloudflare 배포 기다리기
        run: sleep 150
      - name: 새 글 주소 알리기
        run: python3 .github/scripts/indexnow.py
